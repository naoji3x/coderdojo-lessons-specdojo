id: prj-0001:dct-scratch-lessons
type: project
status: draft
title: Scratch教材 成果物カタログ（全5回）
rulebook: specdojo:dct-rulebook
part_of:
  - prj-0001:dct-index
project_id: prj-0001
domain: scratch-lessons
base_path: /../coderdojo-lessons/courses/scratch-basic
groups:
  - name: コース計画
    deliverables:
      - local_id: cpl-scratch-basic
        name: Scratch基礎 コース計画（全5回）
        kind: work
        depends_on: []
        overview: 全5回の学習内容・積み上がり・45分構成・コース方針を定め、各回の指導案の根拠とする。
        path: course-plan.md
        rulebook: undecided
        done_criteria:
          - text: 対象・環境・全5回のねらいと使用機能・学習内容の積み上がり・各回45分の構成・指導方針が対応し、指導案作成の入力として確認できること。
            roles:
              - QE
            viewpoint: vp-qe-verifiability
          - text: 教材リポジトリ内の正本の配置・成果物ID・参照先が一意に解決し、旧設計へのリンクと確認済みの指導案の根拠を区別できること。
            roles:
              - QE
            viewpoint: vp-qe-verifiability
        note: 人が判断して保守する計画のためworkとする。既存計画を移行したもので、教材作成Scheduleでは新規作業から除外する。専用rulebookは未整備で要否未判断のためundecidedとし、本体の準拠先はnoneとする。旧設計へのリンクは移動前の参照先を維持するが、指導案の根拠として無条件に採用しない。
  - name: 第1回 猫から逃げろ！追いかけっこゲーム
    base_path: lessons/010-chase-game
    deliverables:
      - local_id: lpl-chase-game
        name: 第1回 指導案
        kind: work
        depends_on:
          - cpl-scratch-basic
        overview: 「猫から逃げろ！追いかけっこゲーム」の授業の進め方と到達条件を定める。
        path: lesson-plan.md
        rulebook: edu-scratch:lpl-rulebook
        done_criteria:
          - text: コース計画の第1回「猫から逃げろ！追いかけっこゲーム」の対象・ねらい・機能・45分の授業構成に対応し、未確認事項を識別できること。
            roles:
              - QE
            viewpoint: vp-qe-verifiability
          - text: ねらい・最低／標準／発展の完成形・活動・時間配分・見取り・進度差対応が整合し、開始・終了・再開と保存の扱いを確認できること。
            roles:
              - QE
            viewpoint: vp-qe-verifiability
        note: 配置先は宣言済み教材リポジトリ coderdojo-lessons。根拠は courses/scratch-basic/course-plan.md。旧設計を無条件に転記しない。kataはdraftを参照し、授業実施済みとは扱わない。
      - local_id: lsd-chase-game
        name: 第1回 投影スライド
        kind: work
        depends_on:
          - lpl-chase-game
        overview: 「猫から逃げろ！追いかけっこゲーム」の指導案に沿って学習者の制作と試行を支える。
        path: slides.md
        rulebook: edu-scratch:lsd-slidev-rulebook
        done_criteria:
          - text: 同じ回のレビュー済み指導案に、説明・制作・試行・到達確認・振り返りの内容と順序が対応していること。
            roles:
              - QE
            viewpoint: vp-qe-verifiability
          - text: Slidev buildと全ページの画像出力が成功し、文字やブロック図・実機確認注記の切れや重なりがないこと。
            roles:
              - QE
            viewpoint: vp-qe-verifiability
        note: 配置先は宣言済み教材リポジトリ coderdojo-lessons。根拠は courses/scratch-basic/course-plan.md。旧設計を無条件に転記しない。kataはdraftを参照し、授業実施済みとは扱わない。
