tasks:
  - local_id: lpl-chase-game
    phase_suffix: "010"
    phase_set: author-review
    phase_id: draft
    name: 成果物を作成する
    duration_days: 0.25
    depends_on: []
    owner: BA
    description: >-
      対象成果物をカタログの配置先に作成する。指導案はコース計画を明示的な入力とし、 同じ回の対象・ねらい・使用機能・45分構成を具体化する。スライドは同じ回の指導案レビュー完了後に作成する。
      旧設計を未確認のまま根拠へ加えず、成果物固有のメタ情報を記入する。 実践の型の保存済みgrade確定と日付・稼働条件合意の前に実際の教材作成は実行しない。
  - local_id: lpl-chase-game
    phase_suffix: "020"
    phase_set: author-review
    phase_id: review
    name: 成果物の作成結果をレビューする
    duration_days: 0.25
    depends_on:
      - T-SCRATCH-LESSONS-lpl-chase-game-010
    owner: BA
    description: >-
      同じ成果物の作成タスク完了後に、最新のgrade結果とカタログの完了条件に基づいて作成タスクの完了可否を判断する。 指導案レビューが完了するまで同じ回のスライド作成へ進めない。
      gradeが未作成・古い場合は推測でレビューを完了せず、評価を先に行う。 実践の型の保存済みgrade確定と日付・稼働条件合意の前に実際の教材作成・レビューは実行しない。
