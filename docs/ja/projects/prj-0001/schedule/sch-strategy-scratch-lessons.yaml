# yaml-language-server: $schema=../../../../../node_modules/specdojo/docs/specdojo/schemas/v1/sch-strategy.schema.yaml
kind: strategy
id: prj-0001:sch-strategy-scratch-lessons
type: project
status: draft
title: Scratch教材 作成・レビュー戦略
rulebook: specdojo:sch-rulebook
track: scratch-lessons
scope:
  catalogs:
    - id: prj-0001:dct-scratch-lessons
      path: /docs/ja/projects/prj-0001/010-deliverables-catalog/dct-scratch-lessons.yaml
      local_ids:
        - lpl-chase-game
        - lsd-chase-game
        - lpl-music-art
        - lsd-music-art
        - lpl-ai-rps
        - lsd-ai-rps
        - lpl-original-project
        - lsd-original-project
  include_kinds: [work]
approach_rules:
  - local_ids:
      - lpl-chase-game
      - lsd-chase-game
      - lpl-music-art
      - lsd-music-art
      - lpl-ai-rps
      - lsd-ai-rps
      - lpl-original-project
      - lsd-original-project
    intent: author-deliverable
phase_sets:
  author-review:
    - id: draft
      name: 成果物を作成する
      task_suffix: "010"
      duration_days: 0.25
      execution: agent
      mode: edit
      approach: fully-guided
      agent_pipeline:
        stages:
          - stage_role: executor
            proficiency: expert
          - stage_role: reporter
            proficiency: normal
      description: >-
        対象成果物をカタログの配置先に作成する。指導案はコース計画を明示的な入力とし、
        同じ回の対象・ねらい・使用機能・45分構成を具体化する。スライドは同じ回の指導案レビュー完了後に作成する。
        旧設計を未確認のまま根拠へ加えず、成果物固有のメタ情報を記入する。
    - id: review
      name: 成果物の作成結果をレビューする
      task_suffix: "020"
      duration_days: 0.25
      execution: agent
      mode: review
      approach: fully-guided
      agent_pipeline:
        stages:
          - stage_role: executor
            proficiency: expert
          - stage_role: reporter
            proficiency: normal
      description: >-
        同じ成果物の作成タスク完了後に、最新のgrade結果とカタログの完了条件に基づいて作成タスクの完了可否を判断する。
        指導案レビューが完了するまで同じ回のスライド作成へ進めない。
        gradeが未作成・古い場合は推測でレビューを完了せず、評価を先に行う。
default_phase_set: author-review
owner_rules:
  - local_ids:
      - lpl-chase-game
      - lsd-chase-game
      - lpl-music-art
      - lsd-music-art
      - lpl-ai-rps
      - lsd-ai-rps
      - lpl-original-project
      - lsd-original-project
    owner: BA
settings:
  notes: >-
    第1・3・4・5回の8成果物だけを対象とし、各回を指導案作成→指導案レビュー→スライド作成→スライドレビューの4段階へ展開する。
    コース計画cpl-scratch-basicは既存の入力なので新規作成しないが、各指導案のカタログ依存として解決する。
    第2回lpl-balloon-gameとlsd-balloon-gameは利用者指定で完成済みのためscopeから除外し、タスクを生成しない。
    完了日・完了actorが未確認のためinitial_stateは作らない。全フェーズ0.25日、全担当BAは利用者の明示指定。
    開始日・期限・カレンダーは未合意のため設定しない。個票の期限2026-10-31を教材Scheduleへ転記しない。
    kata整備とコース計画移行はPJR-VD0X・PJR-Y36Gの統合後レビューを確認済み。
    schedule_pathとexecution_pathの設定反映後、npx specdojo schedule buildでsch-track-scratch-lessons.yamlを生成済み。
