pre-commit:
  parallel: true
  jobs:
    - name: format documentation and configuration
      glob: "*.{md,json,yml,yaml}"
      run: npx prettier --check {staged_files}
    - name: lint Markdown documentation
      glob: "*.md"
      run: npx markdownlint -- {staged_files}
    # Slidev のスライドの名前と、専用の設定の glob・順番を確かめる。設定ファイルを変えたときも走らせる。
    - name: check Slidev decks and their lint settings
      glob:
        - "*.md"
        - ".markdownlint-cli2.yaml"
        - ".markdownlintignore"
        - ".prettierrc"
        - "tools/check-slidev-files.mjs"
      run: node tools/check-slidev-files.mjs {staged_files}
